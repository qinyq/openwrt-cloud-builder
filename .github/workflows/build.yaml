name: Build OpenWrt with ccache

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout local repository
      uses: actions/checkout@v4

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt source code
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    # 【改动 1】：使用全新的 ccache 专属缓存键和路径
    - name: Restore OpenWrt ccache
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/dl
          openwrt/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('seed.config') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ hashFiles('seed.config') }}-
          ${{ runner.os }}-openwrt-ccache-

    - name: Update and install feeds
      run: |
        cd openwrt
        [ -e ../scripts/diy-part1.sh ] && bash ../scripts/diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom config and scripts
      run: |
        [ -e files ] && cp -r files openwrt/files
        cd openwrt
        [ -e ../scripts/diy-part2.sh ] && bash ../scripts/diy-part2.sh
        [ -e ../seed.config ] && mv ../seed.config .config
        # 【改动 2】：强行开启 OpenWrt 的 ccache 编译加速功能
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ==================== 【阶段一：打铁并建立哈希库】 ====================
    - name: Compile Tools & Toolchain
      run: |
        cd openwrt
        echo "=== [1/2] Compiling Host Tools ==="
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        echo "=== [2/2] Compiling Cross Toolchain (gcc, musl, llvm) ==="
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    # ==================== 【中途插队：立刻强制存盘 ccache】 ====================
    - name: Save ccache Midway
      uses: actions/cache/save@v4
      with:
        path: |
          openwrt/dl
          openwrt/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('seed.config') }}-${{ github.run_id }}

    # ==================== 【过河拆桥：极限清理打铁残渣】 ====================
    - name: Extreme Cleanup (Free space for Packages)
      run: |
        cd openwrt
        echo "=== 磁盘清理前 ==="
        df -hT
        
        # 1. 砸碎模具：删除已经安装到 staging_dir 的宿主机和工具链的中间编译产物
        # 这些东西极其庞大（尤其是 llvm），删掉至少能瞬间腾出 10GB-15GB 空间！
        rm -rf build_dir/toolchain-*
        rm -rf build_dir/host/llvm-*
        rm -rf build_dir/host/gcc-*
        rm -rf build_dir/host/binutils-*
        rm -rf build_dir/host/go-*
        
        # 2. 给 ccache 上紧箍咒：限制它的最大容量为 5GB，超出会自动清理旧缓存
        [ -f ./staging_dir/host/bin/ccache ] && ./staging_dir/host/bin/ccache -M 5G || true
        
        echo "=== 磁盘清理后 ==="
        df -hT
        
    # ==================== 【阶段二：编译插件与固件】 ====================
    - name: Compile Packages & Target Firmware
      id: compile
      run: |
        cd openwrt
        echo "=== Compiling target packages and image ==="
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files (Clean up IPKs)
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}