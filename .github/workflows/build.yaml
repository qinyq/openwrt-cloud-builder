name: Build OpenWrt with Cache

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout local repository
      uses: actions/checkout@v4

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        # 使用 ImmortalWrt 官方提供的依赖一键安装脚本
        sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/tools/ready-to-compile)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt source code
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    # 核心：配置 DL 目录缓存
    - name: Cache dl directory
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('seed.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    - name: Update and install feeds
      run: |
        cd openwrt
        [ -e ../scripts/diy-part1.sh ] && bash ../scripts/diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom config and scripts
      run: |
        [ -e files ] && cp -r files openwrt/files
        cd openwrt
        [ -e ../scripts/diy-part2.sh ] && bash ../scripts/diy-part2.sh
        [ -e ../seed.config ] && mv ../seed.config .config
        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Firmware_${{ github.run_id }}
        path: openwrt/bin/targets/
